work_dir: ./work_dir/joint

# feeder
feeder: feeders.feeder_dhg14_28.Feeder
train_feeder_args:
  data_path: joint  
  label_path: train 
  debug: False
  random_choose: True
  random_shift: False
  random_move: False
  window_size: 150 
  normalization: False
  repeat: 5 
  label_flag: 28 
  idx: 18


test_feeder_args:
  data_path: joint 
  label_path: val 
  debug: False
  random_choose: False
  idx: 18
  label_flag: 28 

# model
model: model.sipn.Model   
model_args:
  graph_cfg:
    layout: "dhg"
    mode: "random"    
    num_filter: 4
    init_off: 0.04
    init_std: 0.02
  num_classes: 28
  in_channels: 3
  base_channels: 64
  ch_ratio: 2
  num_stages: 10
  inflate_stages: [5, 8]
  down_stages: [5, 8]
  data_bn_type: 'VC'
  num_person: 1
  pretrained: None
  dropout: 0.0


#optim
weight_decay: 0.0004
base_lr: 0.1
lr_decay_rate: 0.1
step: [70, 100]
warm_up_epoch: 20

# training
device: [0]
batch_size: 64
test_batch_size: 64
num_epoch: 170
nesterov: True
seed : 4
